<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lift Happens</title>
<meta name="description" content="Personal gym plan and log">
<meta name="theme-color" content="#0A1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Happens">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<script>
// Screen height: when a Home Screen web app opens, iOS (26) can lay the page out as if the screen
// were shorter by the status bar, until the first touch. Installed in portrait, the app fills the
// whole screen, so the page, its pop-ups and messages all use the real screen height there
// (the window height elsewhere).
(function () {
  var root = document.documentElement;
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  // While a number is being typed, iOS may move the page so the field stays above the keyboard: leave it.
  function editing() {
    var a = document.activeElement;
    return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
  }
  function settle() { if (!editing() && (window.scrollY || window.scrollX)) window.scrollTo(0, 0); }
  function fit() {
    var portrait = window.innerHeight >= window.innerWidth;
    var h = standalone && portrait && window.screen && screen.height ? screen.height : window.innerHeight;
    if (h > 0) root.style.setProperty('--app-h', h + 'px');
    settle();
  }
  window.addEventListener('scroll', settle, { passive: true });
  document.addEventListener('focusout', function () { setTimeout(settle, 60); setTimeout(settle, 400); });
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  window.addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { fit(); setTimeout(fit, 300); } });
  [100, 400, 1000, 2500].forEach(function (t) { setTimeout(fit, t); });
})();
</script>
</head>
<body>
<div id="app"><div class="boot"><img src="icons/face.png" width="120" alt=""><span>Lift Happens</span></div></div>
<noscript>Lift Happens needs JavaScript.</noscript>
<script>
// Start-up watchdog: if the app has not started after a few seconds, show what went wrong
// and offer a repair that clears the cached app files (workout data is kept).
(function () {
  // No zooming: block iOS pinch gestures (Safari ignores user-scalable=no on its own).
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  var errors = [];
  window.addEventListener('error', function (e) {
    errors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    errors.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
  });
  window.liftRepair = function () {
    var done = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    var steps = [];
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      steps.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      steps.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }));
    }
    Promise.all(steps).then(done, done);
  };
  // When an updated service worker takes over, reload once so the page runs the new files.
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }
  setTimeout(function () {
    if (window.__liftReady) return;
    var box = document.getElementById('app');
    box.innerHTML = '<div class="boot-error">' +
      '<h1>Lift Happens did not start</h1>' +
      '<p>Your plans and workouts are safe on this iPhone. Tap Repair to download the app files again.</p>' +
      '<button class="btn btn-primary btn-big" onclick="liftRepair()">Repair and reload</button>' +
      '<pre></pre></div>';
    box.querySelector('pre').textContent = errors.length ? errors.join('\n') : 'No error message.';
  }, 15000);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
